# Optional nginx config for the Chabokan "Static" service.
#
# Chabokan already ships the same server block with sensible defaults; this file
# only adds long-lived caching for the fingerprinted bundle and the product
# images. Copy it into the deployed project root as `nginx.conf` and restart the
# service ("Copy NGINX Configuration" must appear in the logs).
#
# The root must stay /app/dist: that is where the platform unpacks the project's
# `dist` directory.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /app/dist;
    index index.html index.htm;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite fingerprints every file in /assets/, so it is safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Product and hero images keep stable names, so a shorter window.
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Single-page application fallback: /products/<slug> must return index.html.
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
