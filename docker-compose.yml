name: shalvarsara

services:
  db:
    image: postgres:16-alpine
    container_name: shalvarsara-db
    restart: unless-stopped
    env_file:
      # Optional: the defaults below are enough for local development, so a
      # missing root .env must not stop `docker compose up`.
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shalvarsara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shalvarsara}
      POSTGRES_DB: ${POSTGRES_DB:-shalvarsara}
    ports:
      # Bound to the loopback interface on purpose: publishing 5432 on 0.0.0.0
      # exposes the database to the whole local network, and on a laptop that
      # joins untrusted Wi-Fi it is reachable by anyone on the same subnet.
      # The backend service reaches it over the compose network as `db:5432`.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shalvarsara} -d ${POSTGRES_DB:-shalvarsara}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shalvarsara-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shalvarsara}:${POSTGRES_PASSWORD:-shalvarsara}@db:5432/${POSTGRES_DB:-shalvarsara}?sslmode=disable
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: shalvarsara-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
